# config/packages/knp_paginator.yaml
knp_paginator:
    page_range: 5  # Nombre de pages à afficher dans la pagination
    default_options:
        page_name: page  # Nom du paramètre de la page
        sort_field_name: sort  # Nom du paramètre pour le tri
        sort_direction_name: direction  # Nom du paramètre pour la direction du tri
        filter_field_name: filter  # Nom du paramètre pour la filtration (si utilisé)
        distinct: true  # Permet de rendre la pagination distincte
    template:
        pagination: '@KnpPaginator/Pagination/sliding.html.twig'  # Template pour la pagination
        sortable: '@KnpPaginator/Pagination/sortable.html.twig'  # Template pour les colonnes triables
        filtration: '@KnpPaginator/Pagination/filtration.html.twig'  # Template pour la filtration
        rel_links: false  # Rel links (généralement utilisé pour les URL relatives)
