# config/packages/security.yaml
security:
    enable_authenticator_manager: true
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target:  app_login
                csrf_token_id: logout
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/app_home, roles: ROLE_CLIENT } # Restreindre l'accès à /admin aux utilisateurs avec ROLE_ADMIN
        - { path: ^/login, roles: PUBLIC_ACCESS } # Autoriser l'accès à la page de connexion pour tous
        - { path: ^/register, roles: PUBLIC_ACCESS } # Autoriser l'accès à la page d'inscription pour tous
        - { path: ^/, roles: PUBLIC_ACCESS } # Autoriser l'accès à la page d'accueil pour tous
        
